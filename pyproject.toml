[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woudc-extcsv"
version = "0.8.dev0"
description = "Python package providing read/write support of the WOUDC Extended CSV format."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
keywords = ["woudc", "ozone", "uv", "ultra-violet", "WMO", "Extended CSV"]
authors = [
    {name = "Thinesh Sornalingam", email = "thinesh.sornalingam@ec.gc.ca"},
    {name = "Tom Kralidis", email = "tomkralidis@gmail.com"}
]
maintainers = [
    {name = "Tom Kralidis", email = "tomkralidis@gmail.com"},
    {name = "Kevin Ngai", email = "kevin.ngai@ec.gc.ca"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Atmospheric Science"
]
dependencies = [
    "jsonschema",
    "pyyaml"
]

[project.optional-dependencies]
dev = ["Cython", "flake8"]
release = ["build", "twine", "wheel"]

[project.urls]
homepage = "https://github.com/woudc/woudc-extcsv"
source = "https://github.com/woudc/woudc-extcsv"
documentation = "https://github.com/woudc/woudc-extcsv"
issues = "https://github.com/woudc/woudc-extcsv/issues"

[tool.setuptools.package-data]
"woudc_extcsv.resources" = ["*.csv", "*.json", "*.yml"]
